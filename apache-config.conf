<VirtualHost *:80>
    ServerName localhost

    # Настройка WSGI: запускаем наше приложение в отдельном процессе
    WSGIDaemonProcess web_service user=www-data group=www-data threads=5
    WSGIProcessGroup web_service

    # Говорим: "Все запросы (/) передавай в файл web_service.wsgi"
    WSGIScriptAlias / /app/web_service.wsgi

    # Разрешаем Apache читать файлы из папки /app
    <Directory /app>
        Require all granted
    </Directory>

    # Для отдачи видео напрямую через Apache (минуя Python)
    # URL /media/... будет ссылаться на папку /app/uploads/...
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Require all granted
    </Directory>

    # Настройки логирования для отладки
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>