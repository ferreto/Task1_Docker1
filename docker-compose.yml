services:
  web:
    build: .
    ports:
      - "8000:80" # Пробрасываем порт 8000 хоста на 80 порт Apache в контейнере
    volumes:
      - uploads:/app/uploads # Монтируем том для сохранения видео
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: videos
      DB_USER: video_user
      DB_PASSWORD: video_pass
    depends_on:
      db:
        condition: service_healthy # Web запустится только когда БД будет готова

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: videos
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: video_pass
    volumes:
      - db_data:/var/lib/postgresql/data # Монтируем том для базы
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d videos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads: